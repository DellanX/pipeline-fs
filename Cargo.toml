[package]
name = "pipeline-fs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pipeline-fs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.134"
serde_yaml = "0.9.34"
toml = "0.8.19"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.18"
warp = "0.3.7"
tokio-util = { version = "0.7.12", features = ["io"] }

[dev-dependencies]
tokio-test = "0.4.4"
